<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Cripto - Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #58a6ff; }

        /* Filtros */
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; padding: 15px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; }
        .filters label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 4px; }
        .filters select, .filters input { background: #0d1117; border: 1px solid #30363d; color: #e1e4e8; padding: 8px 12px; border-radius: 6px; font-size: 14px; }

        /* Cards de métricas */
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .metric-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; }
        .metric-card .value { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .metric-card .label { font-size: 12px; color: #8b949e; }
        .positive { color: #3fb950; }
        .negative { color: #f85149; }
        .neutral { color: #58a6ff; }

        /* Tabla de estrategias */
        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .section h2 { font-size: 16px; margin-bottom: 15px; color: #e1e4e8; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { color: #8b949e; font-weight: 500; }
        tr:hover { background: #1c2128; }

        /* Botón de detalle */
        .btn-detail { background: #1f6feb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-detail:hover { background: #388bfd; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 90%; max-width: 1000px; max-height: 90vh; overflow-y: auto; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 18px; }
        .modal-close { background: none; border: none; color: #8b949e; font-size: 24px; cursor: pointer; }
        .modal-close:hover { color: #e1e4e8; }

        /* Info del trade */
        .trade-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; padding: 15px; background: #0d1117; border-radius: 8px; }
        .trade-info .item { }
        .trade-info .item .label { font-size: 11px; color: #8b949e; }
        .trade-info .item .value { font-size: 14px; font-weight: 500; }

        /* Gráfico */
        #chart-container { width: 100%; height: 400px; background: #0d1117; border-radius: 8px; }

        /* Win rate bar */
        .winrate-bar { width: 100%; height: 8px; background: #30363d; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .winrate-fill { height: 100%; background: #3fb950; transition: width 0.3s; }

        /* Badge */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge-win { background: rgba(63, 185, 80, 0.2); color: #3fb950; }
        .badge-loss { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        .badge-open { background: rgba(88, 166, 255, 0.2); color: #58a6ff; }
        .badge-long { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .badge-short { background: rgba(248, 81, 73, 0.15); color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Bot Cripto - Dashboard</h1>

        <!-- Filtros -->
        <div class="filters">
            <div>
                <label>Estrategia</label>
                <select id="filter-estrategia" onchange="applyFilters()">
                    <option value="">Todas</option>
                </select>
            </div>
            <div>
                <label>Símbolo</label>
                <select id="filter-simbolo" onchange="applyFilters()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label>Desde</label>
                <input type="date" id="filter-desde" onchange="applyFilters()">
            </div>
            <div>
                <label>Hasta</label>
                <input type="date" id="filter-hasta" onchange="applyFilters()">
            </div>
            <div>
                <label>Resultado</label>
                <select id="filter-resultado" onchange="applyFilters()">
                    <option value="">Todos</option>
                    <option value="TP">Ganó</option>
                    <option value="SL">Perdió</option>
                    <option value="ABIERTA">Abiertas</option>
                </select>
            </div>
        </div>

        <!-- Métricas -->
        <div class="metrics">
            <div class="metric-card">
                <div class="label">Total Trades</div>
                <div class="value neutral" id="stat-total">-</div>
            </div>
            <div class="metric-card">
                <div class="label">Win Rate</div>
                <div class="value" id="stat-winrate">-</div>
                <div class="winrate-bar"><div class="winrate-fill" id="stat-winrate-bar"></div></div>
            </div>
            <div class="metric-card">
                <div class="label">Win Rate Global</div>
                <div class="value" id="stat-winrate-global">-</div>
                <div class="winrate-bar"><div class="winrate-fill" id="stat-winrate-global-bar"></div></div>
            </div>
        </div>

        <!-- Rendimiento por Estrategia -->
        <div class="section">
            <h2>📈 Rendimiento por Estrategia (Filtrado)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Estrategia</th>
                        <th>Trades</th>
                        <th>Wins</th>
                        <th>Win Rate</th>
                    </tr>
                </thead>
                <tbody id="table-estrategias"></tbody>
            </table>
        </div>

        <!-- Historial -->
        <div class="section">
            <h2>📋 Historial de Operaciones</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Par</th>
                        <th>Estrategia</th>
                        <th>Tipo</th>
                        <th>Entrada</th>
                        <th>Rango</th>
                        <th>Salida</th>
                        <th>Resultado</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody id="table-trades"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal de detalle -->
    <div class="modal" id="modal-detail">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Detalle Trade</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="trade-info" id="modal-trade-info"></div>
            <div id="chart-container"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let candleSeries = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadFilters();
            loadData();
        });

        async function loadFilters() {
            const resp = await fetch('/api/filters');
            const data = await resp.json();

            const selEst = document.getElementById('filter-estrategia');
            data.estrategias.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                selEst.appendChild(opt);
            });

            const selSim = document.getElementById('filter-simbolo');
            data.simbolos.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                selSim.appendChild(opt);
            });
        }

        function getFilters() {
            return {
                estrategia: document.getElementById('filter-estrategia').value,
                simbolo: document.getElementById('filter-simbolo').value,
                desde: document.getElementById('filter-desde').value,
                hasta: document.getElementById('filter-hasta').value,
                resultado: document.getElementById('filter-resultado').value
            };
        }

        function buildQuery(params) {
            const q = new URLSearchParams();
            Object.entries(params).forEach(([k, v]) => { if (v) q.set(k, v); });
            return q.toString();
        }

        function formatResult(resultado) {
            if (!resultado || resultado === 'ABIERTA') return { text: 'Abierta', cls: 'badge-open' };
            if (resultado.includes('TP') || resultado.includes('Ganó')) return { text: 'Ganó', cls: 'badge-win' };
            if (resultado.includes('SL') || resultado.includes('Perdió')) return { text: 'Perdió', cls: 'badge-loss' };
            if (resultado.includes('CORREGIDO')) return { text: 'Corregido', cls: 'badge-open' };
            return { text: resultado, cls: 'badge-open' };
        }

        async function loadData() {
            const params = getFilters();
            const qs = buildQuery(params);

            // Stats filtrados
            const statsResp = await fetch('/api/stats?' + qs);
            const stats = await statsResp.json();
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-winrate').textContent = stats.win_rate + '%';
            document.getElementById('stat-winrate').className = 'value ' + (stats.win_rate >= 50 ? 'positive' : 'negative');
            document.getElementById('stat-winrate-bar').style.width = stats.win_rate + '%';

            // Stats globales (sin filtros)
            const globalResp = await fetch('/api/stats');
            const globalStats = await globalResp.json();
            document.getElementById('stat-winrate-global').textContent = globalStats.win_rate + '%';
            document.getElementById('stat-winrate-global').className = 'value ' + (globalStats.win_rate >= 50 ? 'positive' : 'negative');
            document.getElementById('stat-winrate-global-bar').style.width = globalStats.win_rate + '%';

            // Tabla estrategias
            const tbodyEst = document.getElementById('table-estrategias');
            tbodyEst.innerHTML = '';
            stats.por_estrategia.forEach(e => {
                tbodyEst.innerHTML += `
                    <tr>
                        <td>${e.estrategia}</td>
                        <td>${e.total}</td>
                        <td>${e.wins}</td>
                        <td>
                            <span class="${e.win_rate >= 50 ? 'positive' : 'negative'}">${e.win_rate}%</span>
                            <div class="winrate-bar"><div class="winrate-fill" style="width:${e.win_rate}%"></div></div>
                        </td>
                    </tr>
                `;
            });

            // Trades
            const tradesResp = await fetch('/api/trades?' + qs);
            const trades = await tradesResp.json();

            const tbodyTrades = document.getElementById('table-trades');
            tbodyTrades.innerHTML = '';
            trades.forEach(t => {
                const tipoClass = t.tipo === 'LONG' ? 'badge-long' : 'badge-short';
                const res = formatResult(t.resultado);
                const rango = (t.rango_alto && t.rango_bajo)
                    ? t.rango_alto.toFixed(2) + ' / ' + t.rango_bajo.toFixed(2)
                    : '-';

                tbodyTrades.innerHTML += `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.fecha_apertura || '-'}</td>
                        <td>${t.simbolo}</td>
                        <td>${t.estrategia}</td>
                        <td><span class="badge ${tipoClass}">${t.tipo}</span></td>
                        <td>${t.precio_entrada ? t.precio_entrada.toFixed(5) : '-'}</td>
                        <td>${rango}</td>
                        <td>${t.precio_salida ? t.precio_salida.toFixed(5) : '-'}</td>
                        <td><span class="badge ${res.cls}">${res.text}</span></td>
                        <td><button class="btn-detail" onclick="showDetail(${t.id})">🔍</button></td>
                    </tr>
                `;
            });
        }

        function applyFilters() {
            loadData();
        }

        async function showDetail(tradeId) {
            const resp = await fetch('/api/trade/' + tradeId);
            const trade = await resp.json();

            document.getElementById('modal-title').textContent = `Trade #${trade.id} - ${trade.simbolo} ${trade.tipo}`;

            const res = formatResult(trade.resultado);
            const rango = (trade.rango_alto && trade.rango_bajo)
                ? trade.rango_alto.toFixed(5) + ' / ' + trade.rango_bajo.toFixed(5)
                : '-';

            const info = document.getElementById('modal-trade-info');
            info.innerHTML = `
                <div class="item"><div class="label">Par</div><div class="value">${trade.simbolo}</div></div>
                <div class="item"><div class="label">Tipo</div><div class="value"><span class="badge ${trade.tipo === 'LONG' ? 'badge-long' : 'badge-short'}">${trade.tipo}</span></div></div>
                <div class="item"><div class="label">Entrada</div><div class="value">${trade.precio_entrada?.toFixed(5)}</div></div>
                <div class="item"><div class="label">Rango</div><div class="value">${rango}</div></div>
                <div class="item"><div class="label">SL</div><div class="value negative">${trade.sl?.toFixed(5)}</div></div>
                <div class="item"><div class="label">TP</div><div class="value positive">${trade.tp?.toFixed(5)}</div></div>
                <div class="item"><div class="label">Salida</div><div class="value">${trade.precio_salida?.toFixed(5) || '-'}</div></div>
                <div class="item"><div class="label">Resultado</div><div class="value"><span class="badge ${res.cls}">${res.text}</span></div></div>
                <div class="item"><div class="label">Apertura</div><div class="value">${trade.fecha_apertura}</div></div>
                <div class="item"><div class="label">Cierre</div><div class="value">${trade.fecha_cierre || '-'}</div></div>
            `;

            renderChart(trade);
            document.getElementById('modal-detail').classList.add('active');
        }

        function renderChart(trade) {
            const container = document.getElementById('chart-container');
            container.innerHTML = '';

            if (!trade.ohlc || trade.ohlc.length === 0) {
                container.innerHTML = '<p style="padding:20px;color:#8b949e;">No hay datos de velas disponibles</p>';
                return;
            }

            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 400,
                layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
                grid: { vertLines: { color: '#1c2128' }, horzLines: { color: '#1c2128' } },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#3fb950',
                downColor: '#f85149',
                borderUpColor: '#3fb950',
                borderDownColor: '#f85149',
                wickUpColor: '#3fb950',
                wickDownColor: '#f85149'
            });

            candleSeries.setData(trade.ohlc);

            if (trade.precio_entrada) {
                candleSeries.createPriceLine({
                    price: trade.precio_entrada,
                    color: '#58a6ff',
                    lineWidth: 1,
                    lineStyle: 2,
                    axisLabelVisible: true,
                    title: 'Entry'
                });
            }

            if (trade.sl) {
                candleSeries.createPriceLine({
                    price: trade.sl,
                    color: '#f85149',
                    lineWidth: 1,
                    lineStyle: 2,
                    axisLabelVisible: true,
                    title: 'SL'
                });
            }

            if (trade.tp) {
                candleSeries.createPriceLine({
                    price: trade.tp,
                    color: '#3fb950',
                    lineWidth: 1,
                    lineStyle: 2,
                    axisLabelVisible: true,
                    title: 'TP'
                });
            }

            chart.timeScale().fitContent();
        }

        function closeModal() {
            document.getElementById('modal-detail').classList.remove('active');
            if (chart) {
                chart.remove();
                chart = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('resize', () => {
            if (chart) {
                const container = document.getElementById('chart-container');
                chart.applyOptions({ width: container.clientWidth });
            }
        });
    </script>
</body>
</html>
